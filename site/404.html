<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
// Clean URLs: the host (DigitalOcean static site) only serves files, so /releases lands here. Send every page we
// have to its .html before anything is drawn or counted; only a real miss stays on this page (counted in HQ as 404).
// scripts/check-links.mjs fails when a page in site/ is missing from PAGES.
(() => {
  const PAGES = ['releases', 'tutorial', 'privacy', 't3-code-alternative', 'claude-code-session-status', 'story'];
  const p = location.pathname.replace(/\/+$/, '').replace(/\.html?$/, '').toLowerCase(), q = location.search + location.hash;
  const name = p.slice(1);
  let to = '';
  if (p === '' || p === '/index') to = '/';
  else if (PAGES.includes(name)) to = '/' + name + '.html';
  else if (p === '/hq' || p.startsWith('/hq/')) to = 'https://relay.steerify.dev/hq';
  if (to) { document.documentElement.dataset.moved = '1'; location.replace(to + q); }
  else document.documentElement.dataset.notFound = '1';
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steerify · Page not found</title>
